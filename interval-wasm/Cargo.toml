# interval-wasm — WASM web target for interval-core (raw cdylib, no wasm-bindgen).
# Standalone crate (own [workspace] so the parent Interval workspace doesn't absorb
# it, and its size-opt release profile applies). Build with:
#   cargo build --release --target wasm32-unknown-unknown
# Strings cross the boundary as UTF-8 byte ranges in linear memory + a JSON
# result (see src/lib.rs).
[package]
name = "interval-wasm"
version = "0.10.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
interval-core = { path = "../interval-core" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
