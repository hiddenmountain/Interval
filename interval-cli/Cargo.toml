[package]
name = "interval-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Interval CLI: compile, play, check, and dump Interval files"
readme = "../README.md"
keywords = ["midi", "music", "cli", "composition"]
categories = ["multimedia::audio", "command-line-utilities"]

[[bin]]
name = "interval"
path = "src/main.rs"

[dependencies]
interval-core = { version = "0.10.0", path = "../interval-core" }
interval-smf = { version = "0.10.0", path = "../interval-smf" }
interval-rt = { version = "0.10.0", path = "../interval-rt" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
notify = "7"
anyhow = "1"
serde_json = "1"
codespan-reporting = "0.11"
